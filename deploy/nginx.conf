# Add these locations inside the existing TLS server for radio.cliamp.stream.
# Other CLIAMP stations and the GitHub Pages website retain their routes.
location /api/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
}

# Switch this mount when the companion service is ready. Its mixed MP3 uses
# exactly the same music order and speech as the browser's two stems.
location = /omarchy/stream {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
}
